<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline - Sign In</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top right, #063b63 0%, transparent 35%),
                linear-gradient(145deg, #05070a 0%, #0a1118 55%, #061b2c 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 36px 30px;
            background: rgba(8, 14, 20, 0.94);
            border: 1px solid rgba(35, 170, 255, 0.25);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.55);
        }

        .logo {
            width: 180px;
            max-width: 75%;
            display: block;
            margin: 0 auto 28px;
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #8fa6b8;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin: 0 0 8px;
            color: #c7d6e2;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 18px;
            border-radius: 12px;
            border: 1px solid #263b4c;
            background: #0d1720;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #168de2;
            box-shadow: 0 0 0 3px rgba(22, 141, 226, 0.15);
        }

        button {
            width: 100%;
            padding: 16px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(90deg, #0876c9, #19a9ef);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
        }

        button:active {
            transform: scale(0.99);
        }

        .error {
            background: rgba(220, 45, 45, 0.12);
            border: 1px solid rgba(255, 70, 70, 0.35);
            color: #ff9b9b;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 18px;
            text-align: center;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #526878;
            font-size: 12px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="login-card">

        <img src="{{ url_for('static', filename='pipeline-logo.png') }}"
             class="logo"
             alt="Pipeline">

        <h1>Welcome to Pipeline</h1>
        <div class="subtitle">Sign in to continue</div>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <label for="username">Username</label>
            <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
                autofocus
            >

            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">SIGN IN</button>
        </form>

        <div class="footer">PIPELINE</div>
    </div>
</body>
</html>
