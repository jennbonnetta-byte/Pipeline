<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PipeLine — Notifications</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/appearance.css') }}">

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f4f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #17212b;
        }

        .page {
            max-width: 900px;
            margin: auto;
        }

        .back {
            display: inline-block;
            margin-bottom: 18px;
            color: #1685c5;
            text-decoration: none;
            font-weight: 800;
        }

        .card {
            background: white;
            border: 1px solid #dfe7ef;
            border-radius: 18px;
            padding: 20px;
        }

        h1 {
            margin-top: 0;
        }

        .notification {
            padding: 16px 0;
            border-bottom: 1px solid #edf1f5;
        }

        .notification:last-child {
            border-bottom: 0;
        }

        .title {
            font-weight: 850;
        }

        .message {
            margin-top: 5px;
            color: #64748b;
        }

        .date {
            margin-top: 6px;
            color: #94a3b8;
            font-size: 12px;
        }

        .empty {
            color: #718096;
        }

        .notification-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .notification-actions form {
            margin: 0;
        }

        .notification-actions button {
            border: 0;
            border-radius: 10px;
            padding: 9px 14px;
            font-weight: 800;
            cursor: pointer;
        }

        .approve-button {
            background: #1685c5;
            color: white;
        }

        .reject-button {
            background: #f1f5f9;
            color: #b42318;
            border: 1px solid #fecaca !important;
        }
    </style>
</head>

<body>

<div class="page">

    <a class="back"
       href="{{ url_for('owner_dashboard') }}">
        ← Owner Dashboard
    </a>

    <div class="card">

        <h1>Notifications</h1>

        {% if notifications %}

            {% for notification in notifications %}

                <div class="notification">

                    <div class="title">
                        {{ notification[1] }}
                    </div>

                    <div class="message">
                        {{ notification[2] }}
                    </div>

                    <div class="date">
                        {{ notification[4] }}
                    </div>

                    {% if notification[5] == 'time_off_request' and notification[6] %}
                        <div class="notification-actions">
                            <form method="POST"
                                  action="{{ url_for('owner_time_off_action', request_id=notification[6], action='approve') }}">
                                <button type="submit" class="approve-button">✓ Approve</button>
                            </form>

                            <form method="POST"
                                  action="{{ url_for('owner_time_off_action', request_id=notification[6], action='reject') }}">
                                <button type="submit" class="reject-button">✕ Reject</button>
                            </form>
                        </div>
                    {% endif %}

                </div>

            {% endfor %}

        {% else %}

            <div class="empty">
                No notifications.
            </div>

        {% endif %}

    </div>

</div>

</body>
</html>
