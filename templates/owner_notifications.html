<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PipeLine — Notifications</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/appearance.css') }}">

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f4f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #17212b;
        }

        .page {
            max-width: 900px;
            margin: auto;
        }

        .back {
            display: inline-block;
            margin-bottom: 18px;
            color: #1685c5;
            text-decoration: none;
            font-weight: 800;
        }

        .card {
            background: white;
            border: 1px solid #dfe7ef;
            border-radius: 18px;
            padding: 20px;
        }

        h1 {
            margin-top: 0;
        }

        .notification {
            padding: 16px 0;
            border-bottom: 1px solid #edf1f5;
        }

        .notification:last-child {
            border-bottom: 0;
        }

        .title {
            font-weight: 850;
        }

        .message {
            margin-top: 5px;
            color: #64748b;
        }

        .date {
            margin-top: 6px;
            color: #94a3b8;
            font-size: 12px;
        }

        .empty {
            color: #718096;
        }
    </style>
</head>

<body>

<div class="page">

    <a class="back"
       href="{{ url_for('owner_dashboard') }}">
        ← Owner Dashboard
    </a>

    <div class="card">

        <h1>Notifications</h1>

        {% if notifications %}

            {% for notification in notifications %}

                <div class="notification">

                    <div class="title">
                        {{ notification[1] }}
                    </div>

                    <div class="message">
                        {{ notification[2] }}
                    </div>

                    <div class="date">
                        {{ notification[4] }}
                    </div>

                </div>

            {% endfor %}

        {% else %}

            <div class="empty">
                No notifications.
            </div>

        {% endif %}

    </div>

</div>

</body>
</html>
