<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PipeLine - Login</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; display: flex; justify-content: center; align-items: center; height: 90vh; }
        .container { max-width: 400px; width: 100%; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #0056b3; margin-top: 0; }
        .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 25px; }
        label { font-weight: 600; display: block; margin-top: 15px; font-size: 14px; }
        input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
            font-size: 13px;
            font-weight: 500;
            color: #666;
        }

        .remember-row input {
            width: auto;
            margin: 0;
        }

        button { background: #0056b3; color: white; border: none; padding: 14px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; margin-top: 25px; cursor: pointer; }
        .error { color: #d9534f; background: #fdf7f7; border: 1px solid #f5c6cb; padding: 10px; border-radius: 6px; font-size: 13px; text-align: center; margin-bottom: 15px; }
        .forgot-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #0056b3;
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
        }

        .register-link { display: block; text-align: center; margin-top: 20px; color: #0056b3; text-decoration: none; font-weight: bold; font-size: 14px; }
    </style>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/appearance.css') }}">
</head>
<body class="theme-{{ appearance.theme }} pipeline-theme-{{ appearance.theme }} accent-{{ appearance.accent_color }} pipeline-accent-{{ appearance.accent_color }} density-{{ appearance.layout_density }} pipeline-density-{{ appearance.layout_density }} cards-{{ appearance.card_style }} pipeline-cards-{{ appearance.card_style }} font-{{ appearance.font_size }} pipeline-font-{{ appearance.font_size }} pipeline-dashboard-{{ appearance.dashboard_layout }} {% if not appearance.animations %}pipeline-no-animations{% endif %}">
    <div class="container">
        <h2>🚰 PipeLine</h2>
        <div class="subtitle">Plumber Daily Log Login</div>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <label>Username:</label>
            <input type="text" name="username" required autocomplete="off">

            <label>Password:</label>
            <input type="password" name="password" required>

            <label class="remember-row">
                <input type="checkbox"
                       name="remember_me"
                       value="1">
                <span>Stay logged in for 30 days</span>
            </label>

            <button type="submit">Log In</button>

            <a href="{{ url_for('forgot_password') }}"
               class="forgot-link">
                Forgot password?
            </a>

        </form>

        <a href="/register" class="register-link">Don't have an account? Create one</a>
    </div>
</body>
</html>
