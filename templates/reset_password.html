<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PipeLine - Reset Password</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }

        .container {
            max-width: 400px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,.05);
        }

        h2 {
            text-align: center;
            color: #0056b3;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            font-weight: 600;
            display: block;
            margin-top: 15px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            background: #0056b3;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 25px;
            cursor: pointer;
        }

        .success {
            text-align: center;
            color: #166534;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .error {
            color: #b91c1c;
            background: #fef2f2;
            border: 1px solid #fecaca;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 15px;
        }

        .login-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #0056b3;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
    </style>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/appearance.css') }}">
</head>

<body class="theme-{{ appearance.theme }}
             pipeline-theme-{{ appearance.theme }}
             accent-{{ appearance.accent_color }}
             pipeline-accent-{{ appearance.accent_color }}
             density-{{ appearance.layout_density }}
             pipeline-density-{{ appearance.layout_density }}
             cards-{{ appearance.card_style }}
             pipeline-cards-{{ appearance.card_style }}
             font-{{ appearance.font_size }}
             pipeline-font-{{ appearance.font_size }}
             pipeline-dashboard-{{ appearance.dashboard_layout }}
             {% if not appearance.animations %}pipeline-no-animations{% endif %}">

    <div class="container">

        <h2>🚰 PipeLine</h2>

        {% if success %}

            <div class="success">
                Your password has been successfully changed.
                You can now log in with your new password.
            </div>

            <a href="{{ url_for('login') }}"
               class="login-link">
                Go to Login
            </a>

        {% else %}

            <div class="subtitle">
                Choose a new password for your PipeLine account.
            </div>

            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}

            <form method="POST">

                <label>New Password:</label>

                <input type="password"
                       name="password"
                       required
                       minlength="8"
                       autocomplete="new-password">

                <label>Confirm New Password:</label>

                <input type="password"
                       name="confirm_password"
                       required
                       minlength="8"
                       autocomplete="new-password">

                <button type="submit">
                    Reset Password
                </button>

            </form>

        {% endif %}

    </div>

</body>
</html>
