<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PipeLine — Schedule & Dispatch</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/appearance.css') }}">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 16px;
    background: #f4f7fa;
    color: #17212b;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, sans-serif;
}

.page {
    max-width: 1200px;
    margin: auto;
}

.topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.back,
.dashboard {
    text-decoration: none;
    font-weight: 800;
}

.back {
    font-size: 24px;
    color: #17324a;
}

.dashboard {
    margin-left: auto;
    padding: 10px 14px;
    border-radius: 10px;
    background: #0b2239;
    color: white;
    font-size: 13px;
}

.eyebrow {
    color: #1685c5;
    font-size: 11px;
    font-weight: 850;
    letter-spacing: 1.2px;
    text-transform: uppercase;
}

h1 {
    margin: 2px 0 0;
    font-size: 27px;
}

.section {
    background: white;
    border: 1px solid #dfe7ef;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 5px 18px rgba(22,54,86,.05);
}

.section-title {
    font-size: 18px;
    font-weight: 850;
    margin-bottom: 14px;
}

/* CALENDAR */

.calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
}

.calendar-header h2 {
    margin: 0;
    font-size: 21px;
}

.calendar-buttons {
    display: flex;
    gap: 7px;
}

.calendar-buttons button {
    border: 1px solid #d7e1ea;
    background: white;
    border-radius: 9px;
    padding: 7px 11px;
    font-weight: 800;
    cursor: pointer;
}

.calendar-buttons button:hover {
    border-color: #1685c5;
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-top: 1px solid #e1e8ef;
    border-left: 1px solid #e1e8ef;
}

.day-name {
    padding: 8px;
    background: #f7faff;
    border-right: 1px solid #e1e8ef;
    border-bottom: 1px solid #e1e8ef;
    color: #64748b;
    font-size: 11px;
    font-weight: 850;
    text-align: center;
}

.calendar-day {
    min-height: 115px;
    padding: 6px;
    border-right: 1px solid #e1e8ef;
    border-bottom: 1px solid #e1e8ef;
    background: white;
    overflow: hidden;
}

.calendar-day.other-month {
    background: #f8fafc;
    color: #a0aec0;
}

.day-number {
    font-size: 12px;
    font-weight: 850;
    margin-bottom: 5px;
}

.today .day-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 25px;
    height: 25px;
    border-radius: 50%;
    background: #1685c5;
    color: white;
}

.calendar-event {
    display: block;
    width: 100%;
    margin-bottom: 4px;
    padding: 4px 5px;
    border-radius: 6px;
    font-size: 10px;
    line-height: 1.25;
    overflow: hidden;
}

.job-event {
    background: #e8f4fb;
    color: #075d8d;
}

.personal-event {
    background: #f1ecff;
    color: #633ea1;
}

.dayoff-event {
    background: #feeceb;
    color: #a33b3b;
}

.event-title {
    font-weight: 850;
}

.event-meta {
    opacity: .78;
    margin-top: 2px;
}

.calendar-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 12px;
    color: #64748b;
    font-size: 12px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
}

.legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
}

.legend-job {
    background: #e8f4fb;
}

.legend-personal {
    background: #f1ecff;
}

.legend-dayoff {
    background: #feeceb;
}

/* FORMS */

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 13px;
}

.field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.full {
    grid-column: 1 / -1;
}

label {
    color: #475569;
    font-size: 12px;
    font-weight: 800;
}

input,
select,
textarea {
    width: 100%;
    padding: 10px 11px;
    border: 1px solid #d5dee7;
    border-radius: 9px;
    background: white;
    color: #17212b;
    font: inherit;
}

textarea {
    min-height: 75px;
    resize: vertical;
}

.primary {
    margin-top: 14px;
    border: 0;
    border-radius: 10px;
    padding: 11px 17px;
    background: #0b2239;
    color: white;
    font-weight: 800;
    cursor: pointer;
}

.primary:hover {
    background: #123b5d;
}

.two-forms {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.subcard {
    padding: 16px;
    border: 1px solid #dfe7ef;
    border-radius: 14px;
    background: #fbfdff;
}

.subcard h3 {
    margin: 0 0 13px;
    font-size: 16px;
}

@media (max-width: 750px) {

    body {
        padding: 10px;
    }

    .two-forms {
        grid-template-columns: 1fr;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .calendar-day {
        min-height: 90px;
    }

    .day-name {
        font-size: 9px;
    }

    .calendar-event {
        font-size: 9px;
    }
}

body.theme-dark,
body.pipeline-theme-dark {
    background: #09131d;
    color: #edf4fa;
}

body.theme-dark .section,
body.pipeline-theme-dark .section,
body.theme-dark .calendar-day,
body.pipeline-theme-dark .calendar-day,
body.theme-dark .subcard,
body.pipeline-theme-dark .subcard,
body.theme-dark .calendar-buttons button,
body.pipeline-theme-dark .calendar-buttons button {
    background: #111c27;
    border-color: #263847;
    color: #edf4fa;
}

body.theme-dark .day-name,
body.pipeline-theme-dark .day-name {
    background: #182532;
    border-color: #263847;
    color: #b9c6d3;
}

body.theme-dark input,
body.theme-dark select,
body.theme-dark textarea,
body.pipeline-theme-dark input,
body.pipeline-theme-dark select,
body.pipeline-theme-dark textarea {
    background: #182532;
    border-color: #34495a;
    color: #edf4fa;
}

</style>
</head>

<body>

<div class="page">

    <div class="topbar">

        <a class="back"
           href="{{ url_for('owner_dashboard') }}">‹</a>

        <div>
            <div class="eyebrow">Owner Hub</div>
            <h1>Schedule & Dispatch</h1>
        </div>

        <a class="dashboard"
           href="{{ url_for('owner_dashboard') }}">
            Dashboard
        </a>

    </div>

    <!-- CALENDAR -->

    <section class="section">

        <div class="calendar-header">

            <div>
                <h2 id="monthTitle"></h2>
            </div>

            <div class="calendar-buttons">
                <button type="button" onclick="previousMonth()">‹</button>
                <button type="button" onclick="todayMonth()">Today</button>
                <button type="button" onclick="nextMonth()">›</button>
            </div>

        </div>

        <div class="calendar-grid"
             id="calendar">

            <div class="day-name">SUN</div>
            <div class="day-name">MON</div>
            <div class="day-name">TUE</div>
            <div class="day-name">WED</div>
            <div class="day-name">THU</div>
            <div class="day-name">FRI</div>
            <div class="day-name">SAT</div>

        </div>

        <div class="calendar-legend">

            <div class="legend-item">
                <span class="legend-dot legend-job"></span>
                Company Job
            </div>

            <div class="legend-item">
                <span class="legend-dot legend-personal"></span>
                Personal
            </div>

            <div class="legend-item">
                <span class="legend-dot legend-dayoff"></span>
                Day Off
            </div>

        </div>

    </section>

    <!-- ADD ITEMS -->

    <section class="section">

        <div class="section-title">
            Add to My Calendar
        </div>

        <div class="two-forms">

            <div class="subcard">

                <h3>Personal Appointment</h3>

                <form method="POST">

                    <input type="hidden"
                           name="action"
                           value="personal">

                    <input type="hidden"
                           name="event_type"
                           value="appointment">

                    <div class="field">
                        <label>Date</label>
                        <input type="date"
                               name="event_date"
                               required>
                    </div>

                    <br>

                    <div class="field">
                        <label>Appointment</label>
                        <input type="text"
                               name="title"
                               placeholder="Doctor, school, meeting..."
                               required>
                    </div>

                    <br>

                    <div class="form-grid">

                        <div class="field">
                            <label>Start</label>
                            <input type="time"
                                   name="start_time">
                        </div>

                        <div class="field">
                            <label>End</label>
                            <input type="time"
                                   name="end_time">
                        </div>

                    </div>

                    <br>

                    <div class="field">
                        <label>Notes</label>
                        <textarea name="event_notes"></textarea>
                    </div>

                    <button class="primary"
                            type="submit">
                        Add Appointment
                    </button>

                </form>

            </div>

            <div class="subcard">

                <h3>Day Off</h3>

                <form method="POST">

                    <input type="hidden"
                           name="action"
                           value="personal">

                    <input type="hidden"
                           name="event_type"
                           value="day_off">

                    <div class="field">
                        <label>Date</label>
                        <input type="date"
                               name="event_date"
                               required>
                    </div>

                    <br>

                    <div class="field">
                        <label>Label</label>
                        <input type="text"
                               name="title"
                               value="Day Off"
                               required>
                    </div>

                    <br>

                    <div class="field">
                        <label>Notes</label>
                        <textarea name="event_notes"
                                  placeholder="Vacation, personal day, etc."></textarea>
                    </div>

                    <button class="primary"
                            type="submit">
                        Add Day Off
                    </button>

                </form>

            </div>

        </div>

    </section>

    <!-- JOB CREATION -->

    <section class="section">

        <div class="section-title">
            Schedule & Assign Company Job
        </div>

        <form method="POST">

            <input type="hidden"
                   name="action"
                   value="job">

            <div class="form-grid">

                <div class="field">
                    <label>Client</label>

                    <select name="client_id">
                        <option value="">Select client</option>

                        {% for client in clients %}
                            <option value="{{ client[0] }}">
                                {{ client[1] }}
                            </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="field">
                    <label>Assign Employee</label>

                    <select name="employee_id"
                            required>

                        <option value="">
                            Select employee
                        </option>

                        {% for employee in employees %}
                            <option value="{{ employee[0] }}">
                                {{ employee[1] }}
                            </option>
                        {% endfor %}

                    </select>

                </div>

                <div class="field">
                    <label>Date</label>
                    <input type="date"
                           name="date"
                           required>
                </div>

                <div class="field">
                    <label>Location</label>
                    <input type="text"
                           name="destination"
                           placeholder="Job address"
                           required>
                </div>

                <div class="field">
                    <label>Start Time</label>
                    <input type="time"
                           name="start_time">
                </div>

                <div class="field">
                    <label>End Time</label>
                    <input type="time"
                           name="end_time">
                </div>

                <div class="field full">
                    <label>Job Notes</label>
                    <textarea name="notes"
                              placeholder="Work to be completed..."></textarea>
                </div>

                <div class="field full">
                    <label>Materials</label>
                    <textarea name="materials"
                              placeholder="Materials required..."></textarea>
                </div>

            </div>

            <button class="primary"
                    type="submit">
                Schedule & Assign Job
            </button>

        </form>

    </section>

</div>

<script>

const jobs = {{ jobs | tojson }};
const personalEvents = {{ personal_events | tojson }};

let currentMonth = new Date();
currentMonth.setDate(1);

function pad(value) {
    return String(value).padStart(2, '0');
}

function dateKey(date) {
    return date.getFullYear() + '-' +
           pad(date.getMonth() + 1) + '-' +
           pad(date.getDate());
}

function renderCalendar() {

    const calendar = document.getElementById('calendar');

    calendar.querySelectorAll('.calendar-day').forEach(
        element => element.remove()
    );

    const year = currentMonth.getFullYear();
    const month = currentMonth.getMonth();

    document.getElementById('monthTitle').textContent =
        currentMonth.toLocaleDateString(
            undefined,
            {
                month: 'long',
                year: 'numeric'
            }
        );

    const firstDay = new Date(year, month, 1).getDay();

    const daysInMonth =
        new Date(year, month + 1, 0).getDate();

    const previousMonthDays =
        new Date(year, month, 0).getDate();

    const totalCells =
        Math.ceil((firstDay + daysInMonth) / 7) * 7;

    const today = new Date();
    const todayKey = dateKey(today);

    for (let cell = 0; cell < totalCells; cell++) {

        let dayNumber = cell - firstDay + 1;

        let cellDate;
        let otherMonth = false;

        if (dayNumber < 1) {

            dayNumber = previousMonthDays + dayNumber;

            cellDate = new Date(
                year,
                month - 1,
                dayNumber
            );

            otherMonth = true;

        } else if (dayNumber > daysInMonth) {

            dayNumber -= daysInMonth;

            cellDate = new Date(
                year,
                month + 1,
                dayNumber
            );

            otherMonth = true;

        } else {

            cellDate = new Date(
                year,
                month,
                dayNumber
            );

        }

        const key = dateKey(cellDate);

        const cellElement =
            document.createElement('div');

        cellElement.className =
            'calendar-day' +
            (otherMonth ? ' other-month' : '') +
            (key === todayKey ? ' today' : '');

        const number =
            document.createElement('div');

        number.className = 'day-number';
        number.textContent = dayNumber;

        cellElement.appendChild(number);

        jobs
            .filter(job => job.date === key)
            .forEach(job => {

                const event =
                    document.createElement('div');

                event.className =
                    'calendar-event job-event';

                event.innerHTML =
                    '<div class="event-title">🔧 ' +
                    escapeHtml(job.employee) +
                    '</div>' +
                    '<div class="event-meta">' +
                    escapeHtml(job.destination) +
                    '</div>' +
                    (job.start_time
                        ? '<div class="event-meta">' +
                          escapeHtml(job.start_time) +
                          (job.end_time
                              ? '–' + escapeHtml(job.end_time)
                              : '') +
                          '</div>'
                        : '');

                cellElement.appendChild(event);
            });

        personalEvents
            .filter(event => event.date === key)
            .forEach(eventData => {

                const event =
                    document.createElement('div');

                event.className =
                    'calendar-event ' +
                    (eventData.type === 'day_off'
                        ? 'dayoff-event'
                        : 'personal-event');

                const icon =
                    eventData.type === 'day_off'
                        ? '🏖️'
                        : '📌';

                event.innerHTML =
                    '<div class="event-title">' +
                    icon + ' ' +
                    escapeHtml(eventData.title) +
                    '</div>' +
                    (eventData.start_time
                        ? '<div class="event-meta">' +
                          escapeHtml(eventData.start_time) +
                          (eventData.end_time
                              ? '–' + escapeHtml(eventData.end_time)
                              : '') +
                          '</div>'
                        : '');

                cellElement.appendChild(event);
            });

        calendar.appendChild(cellElement);
    }
}

function escapeHtml(value) {

    const div =
        document.createElement('div');

    div.textContent =
        value || '';

    return div.innerHTML;
}

function previousMonth() {
    currentMonth.setMonth(
        currentMonth.getMonth() - 1
    );

    renderCalendar();
}

function nextMonth() {
    currentMonth.setMonth(
        currentMonth.getMonth() + 1
    );

    renderCalendar();
}

function todayMonth() {

    const now = new Date();

    currentMonth =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            1
        );

    renderCalendar();
}

renderCalendar();

</script>

</body>
</html>
