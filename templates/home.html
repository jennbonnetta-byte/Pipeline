<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; max-width: 400px; margin: auto; }
        a { background: #0056b3; color: white; padding: 30px 10px; border-radius: 10px; text-decoration: none; font-weight: bold; }
        a.secondary { background: #6c757d; }
    </style>
</head>
<body>
    <h2>🚰 PipeLine Dashboard</h2>
    <div class="grid">
        <a href="/entry">➕ Daily Entry</a>
        <a href="/history" class="secondary">📁 History</a>
        <a href="/weekly" class="secondary">📊 Weekly</a>
        <a href="/gallery" class="secondary">📷 Photo Gallery</a>
    </div>
</body>
</html>
