<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PipeLine - Weekly Review</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0056b3; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 20px; }
        .job-card { background: #f8f9fa; border-left: 4px solid #0056b3; padding: 12px; margin-bottom: 15px; border-radius: 4px; }
        .job-date { font-weight: bold; color: #0056b3; }
        .job-details { font-size: 14px; margin-top: 5px; }
        .back-btn { display: block; text-align: center; background: #0056b3; color: white; padding: 10px; text-decoration: none; border-radius: 4px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📊 Weekly Review</h2>
        <div class="subtitle">History of Logged Jobs & Hours</div>

        {% if history %}
            {% for job in history %}
            <div class="job-card">
                <div class="job-date">{{ job.date }} — <span style="color: #28a745;">{{ job.hours }} hrs</span></div>
                <div class="job-details">
                    <strong>To:</strong> {{ job.destination }}<br>
                    <strong>Notes:</strong> {{ job.notes }}<br>
                    <strong>Materials:</strong> {{ job.materials }}
                </div>
            </div>
            {% endfor %}
        {% else %}
            <p style="text-align: center; color: #666;">No jobs logged yet!</p>
        {% endif %}

        <a href="/" class="back-btn">⬅ Back to New Entry Form</a>
    </div>
</body>
</html>
