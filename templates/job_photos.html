<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
        .photo-card { margin-bottom: 20px; text-align: center; background: #fff; padding: 10px; border-radius: 6px; }
        img { width: 100%; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>📷 Job Photos</h2>
    {% for photo_url in job.photos %}
    <div class="photo-card">
        <a href="{{ photo_url }}" target="_blank"><img src="{{ photo_url }}"></a>
    </div>
    {% endfor %}
    <a href="/history">⬅ Back</a>
</body>
</html>
