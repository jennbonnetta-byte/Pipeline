<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PipeLine - Plumber Daily Log</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0056b3; margin-bottom: 5px; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .box { background: #f9f9f9; padding: 10px; border: 1px solid #eee; margin-top: 5px; border-radius: 4px; }
        button { background: #0056b3; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; margin-top: 25px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🚰 PipeLine</h2>
        <form method="POST" enctype="multipart/form-data">
            <label>Date:</label>
            <input type="date" name="date" required>
            <label>Hours:</label>
            <input type="text" name="hours" placeholder="e.g., 7.5" required>
            <label>Job Address:</label>
            <input type="text" name="destination" required>
            <label>Notes:</label>
            <textarea name="notes" rows="3" required></textarea>
            <label>Materials:</label>
            <textarea name="materials" rows="2" required></textarea>

            <label>Photos (Batch 1):</label>
            <input class="box" type="file" name="photos" accept="image/*" multiple>
            
            <label>Photos (Batch 2):</label>
            <input class="box" type="file" name="photos2" accept="image/*" multiple>

            <button type="submit">Generate Boss Report</button>
        </form>
    </div>
</body>
</html>
