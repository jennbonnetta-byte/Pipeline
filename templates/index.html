<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PipeLine - Plumber Daily Log</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0056b3; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .photo-box { background: #f8f9fa; padding: 10px; border: 1px dashed #ccc; border-radius: 4px; margin-top: 5px; }
        button { background: #0056b3; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; margin-top: 25px; cursor: pointer; }
        .nav-group { display: flex; justify-content: space-between; margin-top: 15px; }
        .nav-group a { color: #0056b3; text-decoration: none; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🚰 PipeLine</h2>
        <div class="subtitle">Daily Job Tracker</div>
        <form method="POST" enctype="multipart/form-data">
            <label>Date:</label>
            <input type="date" name="date" required>

            <label>Hours Worked:</label>
            <input type="text" name="hours" placeholder="e.g., 7.5" required>

            <label>Job Address / Destination:</label>
            <input type="text" name="destination" placeholder="Client address or name" required>

            <label>Work Performed (Notes):</label>
            <textarea name="notes" rows="4" placeholder="Fixed main line leak..." required></textarea>

            <label>Materials Used:</label>
            <textarea name="materials" rows="3" placeholder="2x 3/4 inch copper elbows, flux, solder..." required></textarea>

            <label>Job Photos (Optional up to 3):</label>
            <div class="photo-box">
                <label style="font-weight:normal; font-size:13px; margin-top:5px;">Photo 1:</label>
                <input type="file" name="photo1" accept="image/*">
                
                <label style="font-weight:normal; font-size:13px; margin-top:10px;">Photo 2:</label>
                <input type="file" name="photo2" accept="image/*">
                
                <label style="font-weight:normal; font-size:13px; margin-top:10px;">Photo 3:</label>
                <input type="file" name="photo3" accept="image/*">
            </div>

            <button type="submit">Generate Boss Report</button>
        </form>
        <div class="nav-group">
            <a href="/history">📁 Job History</a>
            <a href="/weekly">📊 Weekly Summary & Totals</a>
        </div>
    </div>
</body>
</html>
