<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PipeLine - Edit Log</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0056b3; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 15px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .photo-box { background: #f8f9fa; padding: 10px; border: 1px dashed #ccc; border-radius: 4px; margin-top: 5px; }
        button { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; margin-top: 25px; cursor: pointer; }
        .cancel-btn { display: block; text-align: center; background: #6c757d; color: white; padding: 10px; text-decoration: none; border-radius: 4px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>✏️ Edit Job Log</h2>
        <div class="subtitle">Modify entry details below</div>
        <form method="POST" enctype="multipart/form-data">
            <label>Date:</label>
            <input type="date" name="date" value="{{ job.date }}" required>

            <label>Hours Worked:</label>
            <input type="text" name="hours" value="{{ job.hours }}" required>

            <label>Job Address / Destination:</label>
            <input type="text" name="destination" value="{{ job.destination }}" required>

            <label>Work Performed (Notes):</label>
            <textarea name="notes" rows="4" required>{{ job.notes }}</textarea>

            <label>Materials Used:</label>
            <textarea name="materials" rows="3" required>{{ job.materials }}</textarea>

            <label>Add More Photos (Optional):</label>
            <div class="photo-box">
                <input type="file" name="photo1" accept="image/*"><br><br>
                <input type="file" name="photo2" accept="image/*"><br><br>
                <input type="file" name="photo3" accept="image/*">
            </div>

            <button type="submit">Save Changes</button>
        </form>
        <a href="/history" class="cancel-btn">Cancel</a>
    </div>
</body>
</html>
