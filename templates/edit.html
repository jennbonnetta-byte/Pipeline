<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PipeLine - Edit Log</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 450px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #0056b3; margin-top: 0; }
        label { font-weight: 600; display: block; margin-top: 15px; font-size: 14px; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        .box { background: #f9f9f9; padding: 12px; border: 1px dashed #bbb; margin-top: 5px; border-radius: 6px; }
        button { background: #28a745; color: white; border: none; padding: 14px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; margin-top: 25px; cursor: pointer; }

        .job-status-section {
            margin: 15px 0 20px;
        }

        .status-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .status-option {
            margin: 0;
            cursor: pointer;
        }

        .status-option input {
            display: none;
        }

        .status-option span {
            display: block;
            padding: 13px 10px;
            text-align: center;
            border: 2px solid #dfe6ed;
            border-radius: 10px;
            background: #fff;
            font-weight: 700;
            font-size: 13px;
        }

        .status-option input:checked + span {
            border-color: #1685c5;
            background: #edf8ff;
            color: #087bb8;
        }

        @media (max-width: 500px) {
            .status-options {
                grid-template-columns: 1fr;
            }
        }
        .cancel-btn { display: block; text-align: center; background: #6c757d; color: white; padding: 12px; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 10px; font-size: 15px; }
    </style>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/appearance.css') }}">
</head>
<body class="theme-{{ appearance.theme }} pipeline-theme-{{ appearance.theme }} accent-{{ appearance.accent_color }} pipeline-accent-{{ appearance.accent_color }} density-{{ appearance.layout_density }} pipeline-density-{{ appearance.layout_density }} cards-{{ appearance.card_style }} pipeline-cards-{{ appearance.card_style }} font-{{ appearance.font_size }} pipeline-font-{{ appearance.font_size }} pipeline-dashboard-{{ appearance.dashboard_layout }} {% if not appearance.animations %}pipeline-no-animations{% endif %}">
    <div class="container">
        <h2>✏️ Edit Job Log</h2>
        <form method="POST" enctype="multipart/form-data">
            <label>Date:</label>
            <input type="date" name="date" value="{{ job.date }}" required>

            {% if not is_owner %}
            <div class="job-status-section">
                <label>Job Status:</label>

                <div class="status-options">
                    <label class="status-option">
                        <input type="radio"
                               name="assignment_status"
                               value="in_progress"
                               {% if current_status == 'in_progress' %}checked{% endif %}>
                        <span>🟡 In Progress</span>
                    </label>

                    <label class="status-option">
                        <input type="radio"
                               name="assignment_status"
                               value="completed"
                               {% if current_status == 'completed' %}checked{% endif %}>
                        <span>🟢 Completed</span>
                    </label>
                </div>
            </div>
            {% endif %}

            <label>Start Time:</label>
            <input type="time"
                   id="start_time"
                   name="start_time"
                   value="{{ job.start_time or '' }}">

            <label>End Time:</label>
            <input type="time"
                   id="end_time"
                   name="end_time"
                   value="{{ job.end_time or '' }}">

            <label>Hours Worked:</label>
            <input type="text"
                   id="hours"
                   name="hours"
                   value="{{ job.hours or '' }}"
                   readonly>

            <label>Client:</label>
            <select name="client_id">
                <option value="">No Client / Other Job</option>

                {% for client in clients %}
                    <option value="{{ client.id }}"
                        {% if job.client_id|string == client.id|string %}selected{% endif %}>
                        {{ client.name }}
                        {% if client.contact_person %}
                            — {{ client.contact_person }}
                        {% endif %}
                    </option>
                {% endfor %}
            </select>

            <label>Job Address:</label>
            <input type="text" name="destination" value="{{ job.destination }}" required>

            <label>Work Performed (Notes):</label>
            <textarea name="notes" rows="3" required>{{ job.notes }}</textarea>

            <label>Materials Used:</label>
            <textarea name="materials" rows="2" required>{{ job.materials }}</textarea>

            <label>Add More Photos:</label>
            <input class="box" type="file" name="photos" accept="image/*" multiple>

            <button type="submit">Save Changes</button>
        </form>
        <a href="/history" class="cancel-btn">Cancel</a>
    </div>

<script>
function calculateJobHours() {
    const start = document.getElementById("start_time");
    const end = document.getElementById("end_time");
    const hours = document.getElementById("hours");

    if (!start || !end || !hours || !start.value || !end.value) {
        return;
    }

    const [sh, sm] = start.value.split(":").map(Number);
    const [eh, em] = end.value.split(":").map(Number);

    let startMinutes = sh * 60 + sm;
    let endMinutes = eh * 60 + em;

    if (endMinutes < startMinutes) {
        endMinutes += 24 * 60;
    }

    hours.value = ((endMinutes - startMinutes) / 60).toFixed(2);
}

document.addEventListener("DOMContentLoaded", function() {
    const start = document.getElementById("start_time");
    const end = document.getElementById("end_time");

    if (start) start.addEventListener("change", calculateJobHours);
    if (end) end.addEventListener("change", calculateJobHours);
});
</script>

</body>
</html>
